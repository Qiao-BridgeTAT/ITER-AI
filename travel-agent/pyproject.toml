[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "travel-agent"
version = "2.0.0"
description = "ITER AI conversational travel planning agent"
requires-python = ">=3.11"
dependencies = [
    "alibabacloud_dypnsapi20170525==2.0.0",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "cryptography==46.0.3",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "jsonschema==4.25.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "redis==6.4.0",
    "rq==2.11.0",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]
dev = [
    "mcp==1.30.0",
    "aiosqlite==0.21.0",
    "mypy==1.20.2",
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "services"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["backend", "services", "scripts"]
